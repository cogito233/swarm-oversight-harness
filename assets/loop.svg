<text x="612.0" y="613.0" font-size="24" fill="#1F5FBF" font-weight="bold" text-anchor="middle" >Consolidate</text>
<text x="600.0" y="639.0" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >N results → one STATE update</text>
<rect x="255.10134420847703" y="446.0" width="236" height="86" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.2" />
<circle cx="279.10134420847703" cy="470.0" r="13" fill="#B4530A"/>
<text x="279.10134420847703" y="475.0" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >6</text>
<text x="385.10134420847703" y="482.0" font-size="24" fill="#B4530A" font-weight="bold" text-anchor="middle" >Accept gate</text>
<text x="373.10134420847703" y="508.0" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >human signs: draft → accepted</text>
<text x="628" y="324" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle" >Environment as memory</text>
<text x="628" y="344" font-size="12.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >state lives in the repo, not in context</text>
<line x1="558" y1="358" x2="698" y2="358" stroke="#D9DBD6" stroke-width="1"/>
<text x="628" y="380" font-size="12.5" fill="#1F5FBF" font-weight="bold" text-anchor="middle" >HOW problem → retry within budget</text>
<text x="628" y="400" font-size="12.5" fill="#B4530A" font-weight="bold" text-anchor="middle" >WHAT problem → stop &amp; escalate</text>
<text x="40" y="52" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start" letter-spacing="2">ONE ROUND OF THE LOOP</text>
<text x="40" y="72" font-size="13" fill="#5C6670" font-weight="normal" text-anchor="start" >six steps · two human gates</text>
<text x="1160" y="402" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="end" letter-spacing="1.5">AGENTS · everywhere else</text>
<text x="1160" y="420" font-size="12.5" fill="#5C6670" font-weight="normal" text-anchor="end" >one planner + N workers, all replaceable</text>
<text x="40" y="698" font-size="13" fill="#5C6670" font-weight="normal" text-anchor="start" >Many agents in parallel, but a human holds both gates. CHARTER · DECISIONS · JOURNAL · STATE · SPEC · LOG outlive every agent.</text>
