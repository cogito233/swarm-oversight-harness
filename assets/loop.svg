<text x="838.898655791523" y="482.0" font-size="24" fill="#1F5FBF" font-weight="bold" text-anchor="middle" >Verify</text>
<text x="826.898655791523" y="508.0" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >independent · never the worker</text>
<rect x="482.0" y="577.0" width="236" height="86" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2.2" />
<circle cx="506.0" cy="601.0" r="13" fill="#1F5FBF"/>
