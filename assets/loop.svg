<text x="373.10134420847703" y="246.00000000000003" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >human sets WHAT</text>
<rect x="482.0" y="53.0" width="236" height="86" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2.2" />
<circle cx="506.0" cy="77.0" r="13" fill="#1F5FBF"/>
