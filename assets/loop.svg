<text x="838.898655791523" y="220.00000000000003" font-size="24" fill="#1B7F5C" font-weight="bold" text-anchor="middle" >Workers</text>
<text x="826.898655791523" y="246.00000000000003" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >parallel · isolated · TASK → RESULT</text>
<rect x="708.898655791523" y="446.0" width="236" height="86" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2.2" />
<circle cx="732.898655791523" cy="470.0" r="13" fill="#1F5FBF"/>
