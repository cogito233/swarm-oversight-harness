<text x="612.0" y="89.0" font-size="24" fill="#1F5FBF" font-weight="bold" text-anchor="middle" >Split</text>
<text x="600.0" y="115.0" font-size="13.5" fill="#5C6670" font-weight="normal" text-anchor="middle" >file-disjoint tasks · one critical path</text>
<rect x="708.898655791523" y="184.00000000000003" width="236" height="86" rx="12" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="2.2" />
<circle cx="732.898655791523" cy="208.00000000000003" r="13" fill="#1B7F5C"/>
